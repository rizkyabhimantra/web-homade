		<script>
			const passwordInput = document.getElementById('password');
			const togglePassword = document.querySelector('#toggle-password');
			const icon = togglePassword.querySelector('i');

			togglePassword.addEventListener('click', () => {

				const isPassword = passwordInput.type === 'password';

				// Step 1: animasi keluar
				icon.classList.add('icon-hide');

				setTimeout(() => {

					// Step 2: ganti type
					passwordInput.type = isPassword ? 'text' : 'password';

					// Step 3: ganti icon
					icon.classList.remove('bi-eye', 'bi-eye-slash');
					icon.classList.add(isPassword ? 'bi-eye-slash' : 'bi-eye');

					// Step 4: animasi masuk lagi
					icon.classList.remove('icon-hide');

				}, 250); // harus sama dengan duration CSS
			});
		</script>
